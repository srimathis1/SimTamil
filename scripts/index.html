<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamil Grounded Agent Interface</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nirmala+UI&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --user-msg-bg: #2563eb;
            --ai-msg-bg: #334155;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Noto Sans Tamil', 'Nirmala UI', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background-color: var(--card-bg);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .header {
            padding: 16px;
            background-color: #0f172a;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h2 {
            font-size: 1.2rem;
            color: var(--accent-color);
        }

        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 1rem;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user-message {
            align-self: flex-end;
            background-color: var(--user-msg-bg);
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .ai-message {
            align-self: flex-start;
            background-color: var(--ai-msg-bg);
            color: var(--text-color);
            border-bottom-left-radius: 2px;
        }

        .input-container {
            padding: 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            background-color: #0f172a;
        }

        textarea {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 8px;
            resize: none;
            height: 50px;
            outline: none;
            font-size: 1rem;
        }

        textarea:focus {
            border-color: var(--accent-color);
        }

        button {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #7dd3fc;
        }

        .loading-dots span {
            animation: blink 1.4s infinite continuous;
            font-weight: bold;
        }

        @keyframes blink {
            0% { opacity: .2; }
            20% { opacity: 1; }
            100% { opacity: .2; }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <h2>ஆய்வு பங்கேற்பாளர் உரையாடல் (Grounded Agent)</h2>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message ai-message">வணக்கம்! என்னிடம் என்ன கேட்க விரும்புகிறீர்கள்? (Hello! What would you like to ask me?)</div>
    </div>

    <div class="input-container">
        <textarea id="userInput" placeholder="இங்கே கேள்வி கேட்கவும்... (Type in Tamil or English)"></textarea>
        <button id="sendBtn" onclick="sendMessage()">கேள்</button>
    </div>
</div>

<script>
    const BACKEND_URL = "http://127.0.0.1:5000/chat";

    async function sendMessage() {
        const userInput = document.getElementById("userInput");
        const text = userInput.value.trim();

        if (!text) return;

        appendMessage(text, "user-message");
        userInput.value = "";

        const loadingId = appendLoadingIndicator();

        try {
            const response = await fetch(BACKEND_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ message: text })
            });

            const data = await response.json();
            removeLoadingIndicator(loadingId);

            if (data.error) {
                appendMessage(`பிழை (Error): ${data.error}`, "ai-message");
            } else {
                appendMessage(data.reply, "ai-message");
            }

        } catch (error) {
            removeLoadingIndicator(loadingId);
            appendMessage("சர்வர் தொடர்பு பிழை (Backend Connection Error). Make sure app.py is running.", "ai-message");
            console.error(error);
        }
    }

    function appendMessage(text, className) {
        const chatBox = document.getElementById("chatBox");
        const msgDiv = document.createElement("div");
        msgDiv.className = `message ${className}`;
        msgDiv.textContent = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendLoadingIndicator() {
        const chatBox = document.getElementById("chatBox");
        const id = "loading-" + Date.now();
        const msgDiv = document.createElement("div");
        msgDiv.className = "message ai-message loading-dots";
        msgDiv.id = id;
        msgDiv.innerHTML = "பதிலளிக்கிறது<span>.</span><span>.</span><span>.</span>";
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return id;
    }

    function removeLoadingIndicator(id) {
        const elem = document.getElementById(id);
        if (elem) elem.remove();
    }

    document.getElementById("userInput").addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>

</body>
</html>
